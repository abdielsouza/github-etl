name: Update Github ETL Pipeline
on:
  schedule:
    - cron: "0 */6 * * *"
  workflow_dispatch:

jobs:
  update:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - name: Install dependencies
        run: |
          python -m pip install -U pip
          pip install -r requirements.txt
          pip install -e .
      - name: Create configuration
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN_ETL }}
        run: |
          mkdir -p config
          cat > config/etl.toml <<EOF
          [github]
          token = "${GITHUB_TOKEN}"
          users = [
            "abdielsouza"
          ]
          orgs = [
            "nubank"
          ]
          repos = []

          [database]
          path = "data/warehouse.duckdb"
          EOF
      - name: Run pipeline
        run: |
          python -m github_etl.cli
      - name: Commit data
        run: |
          git config user.name github-actions
          git config user.email github-actions@github.com
          git add data/
          git diff --cached --quiet || \
          git commit -m "chore: update dataset"
      - name: Push data
        run: git push
