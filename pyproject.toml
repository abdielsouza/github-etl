[project]
name = "github-etl"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "aiostream>=0.7.1",
    "altair>=6.2.2",
    "asyncpg>=0.31.0",
    "duckdb>=1.5.4",
    "httpx>=0.28.1",
    "polars[rtcompat]>=1.42.1",
    "psycopg[binary]>=3.3.4",
    "pyarrow>=24.0.0",
    "pydantic>=2.13.4",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "pytest-pythonpath>=0.7.3",
    "python-dotenv>=1.2.2",
    "result>=0.17.0",
    "rich>=15.0.0",
    "sqlalchemy>=2.0.51",
    "streamlit>=1.58.0",
    "tomli-w>=1.2.0",
    "typer>=0.26.8",
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
